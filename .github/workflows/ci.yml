name: Desktop extension
on:
  push:
    branches: [main, feature/initial-extension]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.11'
      - name: Install reviewed LHP integration
        run: python -m pip install "git+https://github.com/Mmodarre/Lakehouse_Plumber.git@4a53d72a96c386a12ff237fc0105a31266007f39"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
        env:
          LHP_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: npm run test:bridge
        env:
          LHP_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: npm run test:release
      - name: VS Code integration on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension
        env:
          LHP_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: VS Code integration on macOS and Windows
        if: runner.os != 'Linux'
        run: npm run test:extension
        env:
          LHP_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: npm run audit:production
  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package and audit the universal pre-release VSIX
        run: npm run package
      - name: Read package version
        id: package
        shell: bash
        run: node -e 'const fs=require("node:fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT,`version=${require("./package.json").version}\n`)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lhp-vscode-${{ steps.package.outputs.version }}
          path: |
            .tmp/lhp-vscode-${{ steps.package.outputs.version }}.vsix
            .tmp/lhp-vscode-${{ steps.package.outputs.version }}.vsix.sha256
            .tmp/lhp-vscode-${{ steps.package.outputs.version }}.provenance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
