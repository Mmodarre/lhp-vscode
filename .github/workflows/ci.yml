name: Desktop extension
on:
  push:
    branches: [main, feature/initial-extension]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      - name: Install reviewed LHP integration
        run: python -m pip install "git+https://github.com/Mmodarre/Lakehouse_Plumber.git@98d285ab8a7606867abb5708f2715ebe31a9befc"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
        env:
          LHP_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: npm run test:bridge
        env:
          LHP_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: VS Code integration on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension
        env:
          LHP_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: VS Code integration on macOS and Windows
        if: runner.os != 'Linux'
        run: npm run test:extension
        env:
          LHP_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: npm run audit:production
      - name: Package and audit VSIX
        if: runner.os == 'Linux'
        run: npm run package
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: lhp-vscode-0.2.1
          path: .tmp/lhp-vscode-0.2.1.vsix
          if-no-files-found: error
